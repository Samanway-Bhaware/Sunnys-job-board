# Fly.io config (docs/deploy.md). Verified against https://fly.io/docs/reference/configuration/ on 2026-09-16.
# One always-on machine with a persistent volume: refresh runs take minutes and must not be interrupted.
app = "CHANGE-ME"
primary_region = "lhr"

[build]

[env]
PORT = "3000"
HOSTNAME = "0.0.0.0"
DATABASE_PATH = "/data/jobs.db"
DEFAULT_PROVIDER = "anthropic"
REFRESH_COOLDOWN_MINUTES = "120"
DAILY_REFRESH_CAP = "20"

[mounts]
source = "jobboard_data"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
